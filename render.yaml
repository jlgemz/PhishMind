services:
  # 1. Laravel Web Application
  - type: web
    name: phishmind-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: PhishMind
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: phishmind-web
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: phishmind-ml
          property: host
      - key: RUN_MIGRATIONS
        value: "true"

  # 2. Python ML & Explanation Service
  - type: web
    name: phishmind-ml
    env: docker
    dockerContext: ./ml_service
    dockerfilePath: ./ml_service/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "10000"
